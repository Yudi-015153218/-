function boot(){
  ENV.mode='local';
  var det=Promise.resolve(),claude=window.claude;
  if(ROLE==='auto'&&claude&&claude.use){
    det=Promise.all([claude.use('user').catch(function(){return null;}),claude.use('db').catch(function(){return null;})]).then(function(r){
      ENV.user=r[0];ENV.db=r[1];
      if(!ENV.user)return;
      return ENV.user.id().then(function(id){ENV.uid=id;},function(){}).then(function(){return ENV.user.canEdit();}).then(function(c){ENV.canEdit=!!c;try{ENV.isTeacher=!!c&&localStorage.getItem('silkroad-mode')==='teacher';}catch(e){}},function(){});
    });
  }
  var p=det.then(function(){if(ENV.isTeacher){UI.tab='teach';}});
  p.then(function(){
    var lo=loadLocal();if(lo)adopt(lo);
    if(!ENV.isTeacher)cloudRestoreAcct();
    if(ENV.isTeacher){S.profile={name:'老師',cls:'',seat:'',ok:true};CFG.week=TT.meta.week||1;}
  }).then(function(){
    /* 讀取 URL 參數 ?c= 自動套用老師指令 */
    try{
      var qs=(window.location.search||'')+(window.location.hash||'');
      var mc=qs.match(/[?&#]c=([A-Za-z0-9+/=_-]+)/);
      if(mc){
        var raw=mc[1].replace(/-/g,'+').replace(/_/g,'/');
        while(raw.length%4)raw+='=';
        var bytes=Uint8Array.from(atob(raw),function(x){return x.charCodeAt(0);});
        return gunz(bytes).then(function(txt){
          return parseAny(txt);
        }).then(function(o){
          if(o&&o.kind==='cmd')return handleImport(JSON.stringify(o),'連結指令').then(function(r){
            if(r.ok){UI.banner='\u2705 老師的指令已自動套用：'+r.msg;}
          });
        }).catch(function(){});
      }
    }catch(e){}
  }).then(function(){
    if(ENV.db&&ENV.uid){if(ENV.isTeacher){TT.liveStarted=true;startLive();}else{ENV.cloud||setStatus('☁ 連線中…');scheduleSync();}}else if(ROLE==='auto'&&!ENV.isTeacher&&!cloudCfg()){setStatus('☁ 沒有雲端權限（要登入 claude.ai），請用存檔代碼');}
  }).then(finishBoot,finishBoot);
}

var TT={lastTok:null,tokMsg:'',meta:{scope:'',week:1,weekAt:0,weeks:{},adjs:[],lastExport:0},stu:{},f:{cls:'',q:''},sel:null,imsg:'',tgt:'all',amsg:'',confirmClear:false,hist:[],dmsg:''};
var TDBH=null,TMEM={};
function tOpen(slug){
  return new Promise(function(res){
    try{var rq=indexedDB.open('silkroad-teacher-'+DEPLOY_CODE+(slug?'-'+slug:''),1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};
      rq.onsuccess=function(){TDBH=rq.result;res();};
      rq.onerror=function(){res();};rq.onblocked=function(){res();};
    }catch(e){res();}
  }).then(tLoadAll);
}
function tLoadAll(){
  if(!TDBH)return;
  return new Promise(function(res){
    try{var rq=TDBH.transaction('kv','readonly').objectStore('kv').openCursor();
      rq.onsuccess=function(){var c=rq.result;if(c){TMEM[c.key]=c.value;c.continue();}else res();};
      rq.onerror=function(){res();};
    }catch(e){res();}
  }).then(function(){
    if(TMEM.meta)TT.meta=Object.assign(TT.meta,TMEM.meta);
    Object.keys(TMEM).forEach(function(k){if(k.indexOf('stu:')===0)TT.stu[k.slice(4)]=TMEM[k];});
  });
}
function tPut(k,v){
  TMEM[k]=v;if(!TDBH)return Promise.resolve();
  return new Promise(function(res){try{var tx=TDBH.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=res;tx.onabort=res;}catch(e){res();}});
}
function tDel(k){
  delete TMEM[k];if(!TDBH)return Promise.resolve();
  return new Promise(function(res){try{var tx=TDBH.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=res;tx.onabort=res;}catch(e){res();}});
}

function tSlug(n){return encodeURIComponent(String(n||'').trim().replace(/\s+/g,' ').toLowerCase()).slice(0,80);}
function tHash(s){
  if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
  var h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return Promise.resolve('x'+h.toString(16));
}

function tLoginAct(a,arg){
  var reg=tReg();
if(a==='tlcloud'){
    var em=((document.getElementById('tl-email')||{}).value||'').trim(),pw=(document.getElementById('tl-pw')||{}).value||'';
    if(!em||!pw){TL.msg='請輸入教師帳號（Email）和密碼。';render();return true;}
    TL.msg='登入中…';render();
    tcAuth(em,pw).then(function(j){
      var uid=j.localId,slug='c'+String(uid).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,24);
      return tEnter(slug,em.split('@')[0],function(){
        TC.token=j.idToken;TC.refresh=j.refreshToken;TC.exp=Date.now()+(parseInt(j.expiresIn,10)||3600)*1000;TC.email=em;TC.uid=uid;TC.msg='';TC.since=0;TL.msg='';
        return tcMetaLoad();
      }).then(function(){clearInterval(TC.timer);TC.timer=setInterval(function(){if(!document.hidden)tcPull();},30000);render();return tcPull();});
    },function(e){var m=(e&&e.message)||'error';TL.msg=/INVALID|PASSWORD|EMAIL_NOT_FOUND/.test(m)?'帳號或密碼不對，請再確認一次。':'登入失敗（'+m+'）。';render();});
    return true;
  }
  if(a==='tlpick'){TL.sel=arg;TL.pin='';TL.msg='';render();return true;}
  if(a==='tlback'){TL.sel='';TL.pin='';TL.msg='';render();return true;}
  if(a==='tllegacy'){tEnter('','舊資料');return true;}
  if(a==='tllogin'){
    var e=reg.filter(function(r){return r.s===TL.sel;})[0];if(!e)return true;
    if(!e.h){tEnter(e.s,e.n);return true;}
    tPinHash(e.s,TL.pin).then(function(h){if(h!==e.h){TL.msg='密碼不對。';TL.pin='';render();}else tEnter(e.s,e.n);});return true;
  }
  if(a==='tlnew'){
    var name=String(TL.name||'').trim().replace(/\s+/g,' '),slug=tSlug(name),pin=TL.pin2||'';
    if(!name){TL.msg='請輸入老師姓名。';render();return true;}
    if(reg.some(function(r){return r.s===slug;})){TL.msg='已有同名老師「'+name+'」，請從上方名單選他登入。';render();return true;}
    if(pin&&pin.length<4){TL.msg='密碼至少 4 個字，或留空不設密碼。';render();return true;}
    (pin?tPinHash(slug,pin):Promise.resolve('')).then(function(h){reg.push({s:slug,n:name,h:h});tRegSave(reg);tEnter(slug,name);});return true;
  }
  if(a==='tlimport'){
    parseAny(TL.bk).then(function(o){
      if(!o||o.app!=='silkroad'||o.kind!=='backup'){TL.msg='這不是教師備份代碼。';render();return;}
      var prof=o.prof||{},name=String(prof.n||TL.name||'').trim().replace(/\s+/g,' ');
      if(!name){TL.msg='這份備份沒有老師姓名，請先在「新老師」欄填姓名再匯入。';render();return;}
      var slug=tSlug(name),ex=reg.filter(function(r){return r.s===slug;})[0];
      function go(){
        var done=function(){
          if(!ex){reg.push({s:slug,n:name,h:''});tRegSave(reg);}
          tEnter(slug,name,function(){
            var m=TT.meta;m.scope=prof.scope||'';m.week=prof.week||1;m.weeks=prof.weeks||{};
            return tMeta().then(function(){return tImportOne(o);});
          });
        };
        if(!ex){done();return;}
        var del=indexedDB.deleteDatabase('silkroad-teacher-'+DEPLOY_CODE+'-'+slug);
        del.onsuccess=del.onerror=del.onblocked=done;
      }
      if(ex&&TL.ovw!==slug){TL.ovw=slug;TL.msg='這台電腦已有「'+name+'」的資料。再按一次「匯入備份並登入」，會用備份取代他目前的資料。';render();return;}
      if(ex&&ex.h){tPinHash(slug,TL.pin2).then(function(h){if(h!==ex.h){TL.msg='「'+name+'」有設密碼，請在「新老師」的密碼欄輸入他的密碼。';render();}else go();});return;}
      go();
    }).catch(function(){TL.msg='無法讀取這段代碼，請確認有完整貼上。';render();});
    return true;
  }
  return false;
}

/* Per-class week helpers */
function tGetWeek(cls){

function tSetWeek(cls,wk){
  if(!cls||cls==='all'){TT.meta.week=wk;TT.meta.weekAt=Date.now();}

function tMeta(){tcMetaSave();return tPut('meta',TT.meta);}
function tSign(str){
  return crypto.subtle.importKey('jwk',PRIVJ,{name:'ECDSA',namedCurve:'P-256'},false,['sign']).then(function(k){
    return crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,new TextEncoder().encode(str));
  }).then(function(b){return u8ToB64(new Uint8Array(b));});
}
function tRecs(){
  var sc=parseScope(TT.meta.scope);
  return Object.keys(TT.stu).map(function(k){return TT.stu[k];}).filter(function(r){return inScope(r.cls,sc);}).sort(function(a,b){
    var ca=parseInt(a.cls,10),cb=parseInt(b.cls,10);
    if(!isNaN(ca)&&!isNaN(cb)&&ca!==cb)return ca-cb;
    var sa=parseInt(a.seat,10),sb=parseInt(b.seat,10);
    if(a.cls===b.cls&&!isNaN(sa)&&!isNaN(sb)&&sa!==sb)return sa-sb;
    return String(a.name).localeCompare(String(b.name),'zh-Hant');
  });
}
function tTime(t){return t?new Date(t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}
function phaseLabel(p){return p==='end'?'已結算':p==='play'?'旅程中':p==='ready'?'待出發':'未開始';}
function tImportOne(o){
  if(!TT.who)return Promise.resolve({st:'bad'});
  if(!o||o.app!=='silkroad')return Promise.resolve({st:'bad'});
  if(o.kind==='cmd')return Promise.resolve({st:'cmd'});
  var sc=parseScope(TT.meta.scope);
  if(o.kind==='backup'){
    var n=0,ps=[];
    (o.recs||[]).forEach(function(r){
      if(!r||!r.state||!inScope(r.cls,sc))return;
      var ex=TT.stu[r.key];if(ex&&(ex.state.savedAt||0)>=(r.state.savedAt||0))return;
      TT.stu[r.key]=r;ps.push(tPut('stu:'+r.key,r));n++;
    });
    var have={};TT.meta.adjs.forEach(function(a){have[a.id]=1;});
    ((o.meta&&o.meta.adjs)||[]).forEach(function(a){if(!have[a.id])TT.meta.adjs.push(a);});
    TT.meta.adjs.sort(function(a,b){return a.at-b.at;});ps.push(tMeta());
    return Promise.all(ps).then(function(){return {st:'backup',n:n};});
  }
  if(o.kind==='save'&&!o.state&&o.sum){
    if(!inScope(o.cls,sc))return Promise.resolve({st:'out',cls:normCls(o.cls)});
    var k0=studentKey(o),e0=TT.stu[k0],t0=o.exportedAt||Date.now();
    if(e0&&(e0.state.savedAt||0)>=t0)return Promise.resolve({st:'old'});
    var r0=e0?Object.assign({},e0):{key:k0,cls:normCls(o.cls),seat:normSeat(o.seat),name:String(o.name||'').trim(),state:{v:4,savedAt:t0,summaryOnly:true,phase:o.sum.phase,course:o.course||{},log:[],route:o.route||[],hist:[],adjLog:[]}};
    r0.sum=o.sum;r0.importedAt=Date.now();r0.exportedAt=t0;
    if(!e0||r0.state.summaryOnly){r0.state.savedAt=t0;if(o.course){r0.state.course=o.course;r0.state.route=o.route||[];}}
    TT.stu[k0]=r0;
    return tPut('stu:'+k0,r0).then(function(){return {st:e0?'upd':'new'};});
  }
  if(o.kind!=='save'||!o.state||o.state.v!==4)return Promise.resolve({st:'bad'});
  if(!inScope(o.cls,sc))return Promise.resolve({st:'out',cls:normCls(o.cls)});
  var key=studentKey(o),ex2=TT.stu[key];
  if(ex2&&!ex2.state.summaryOnly&&(ex2.state.savedAt||0)>=(o.state.savedAt||0))return Promise.resolve({st:'old'});
  var rec={key:key,cls:normCls(o.cls),seat:normSeat(o.seat),name:String(o.name||'').trim(),importedAt:Date.now(),exportedAt:o.exportedAt,sum:summaryOf(o.state),state:o.state};
  TT.stu[key]=rec;
  return tPut('stu:'+key,rec).then(function(){return {st:ex2?'upd':'new'};});
}
function tImportTexts(items){
  var sc=parseScope(TT.meta.scope);
  if(!scopeValid(sc)){TT.imsg='請先在上方設定你的授課班級範圍。';render();return;}
  var cnt={bad:0,cmd:0,old:0,out:0,'new':0,upd:0,backup:0},outc={};
  items.reduce(function(pr,it){
    return pr.then(function(){
      var pieces=/SR2\./.test(it.text)?(it.text.match(/SR2\.[A-Za-z0-9_-]+/g)||[]):(it.text.indexOf('silkroad')>=0&&/silkroad[01]:/.test(it.text)?it.text.split(/(?=silkroad[01]:)/):[it.text]);
      return pieces.reduce(function(p2,pc){
        return p2.then(function(){
          if(!pc.trim())return;
          return (/^\s*SR2\./.test(pc)?Promise.resolve().then(function(){return unpackSave(pc);}):parseAny(pc)).then(tImportOne,function(){return {st:'bad'};}).then(function(r){cnt[r.st]=(cnt[r.st]||0)+1;if(r.st==='out')outc[r.cls]=1;});
        });
      },Promise.resolve());
    });
  },Promise.resolve()).then(function(){
    var m='新增 '+cnt['new']+' 份、更新 '+cnt.upd+' 份';
    if(cnt.old)m+='、略過較舊的 '+cnt.old+' 份';
    if(cnt.out)m+='、不在授課範圍而略過 '+cnt.out+' 份（班級 '+Object.keys(outc).join('、')+'）';
    if(cnt.cmd)m+='、'+cnt.cmd+' 份是指令檔（要給學生匯入，這裡不需要）';
    if(cnt.backup)m+='、還原備份 '+cnt.backup+' 份';
    if(cnt.bad)m+='、無法讀取 '+cnt.bad+' 份';
    TT.imsg=m+'。';render();
  });
}
